services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspaces/team-knowledge-copilot
    volumes:
      - ..:/workspaces/team-knowledge-copilot:cached
    command: sleep infinity
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql://copilot_user:dev_password@db:5432/copilot_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: copilot_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: copilot_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot_user -d copilot_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
